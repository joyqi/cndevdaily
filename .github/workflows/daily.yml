name: Daily DevNews

on:
  schedule:
    # GitHub cron 只作兜底，准点发布靠外部定时器触发 workflow_dispatch（见 README「发布时间」）
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-devnews
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 取分支最新提交而不是触发时的 SHA：排队的 run 要能看到前一个 run 刚提交的 history
          ref: ${{ github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run DevNews Bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE_URL: ${{ secrets.OPENAI_API_BASE_URL }}
          OPENAI_API_MODEL: ${{ secrets.OPENAI_API_MODEL }}
          # 写作/评审专用模型（可选，缺省回退到 OPENAI_API_MODEL）
          OPENAI_API_MODEL_WRITER: ${{ secrets.OPENAI_API_MODEL_WRITER }}
          OPENAI_API_MODEL_JUDGE: ${{ secrets.OPENAI_API_MODEL_JUDGE }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
          PUBLISH_AT_UTC: '05:00'
        run: pnpm start

      - name: Commit history and discussions
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update history and discussions"
